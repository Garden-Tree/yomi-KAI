services:
  yomi-kai:
    build: .
    container_name: yomi-kai
    restart: unless-stopped
    volumes:
      # 設定ファイル
      - ./config.ini:/app/config.ini:ro
      # 辞書データとログを永続化
      - ./dict:/app/dict
      - ./log:/app/log
    # Google TTSを使用し、クレデンシャルJSONがある場合は下記をオンにしてパスを合わせます
    # environment:
    #   - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    # volumes:
    #   - ./credentials.json:/app/credentials.json:ro
