name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # voicevox_core / google-cloud-texttospeech は重い・ネイティブ依存のため入れない
      # （テストはこれらを import しない）
      - run: pip install "discord.py[voice]" pytest ruff
      - run: python -m py_compile yomi-KAI.py build.py
      - run: ruff check .
      - run: pytest
